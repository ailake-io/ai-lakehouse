# Phase 2 integration test services
# Usage: docker compose -f tests/docker/compose.yml up -d
services:
  nessie:
    image: projectnessie/nessie:latest
    container_name: ailake-nessie
    ports:
      - "19120:19120"
    environment:
      QUARKUS_HTTP_PORT: 19120

  localstack:
    image: localstack/localstack:latest
    container_name: ailake-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: glue,s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

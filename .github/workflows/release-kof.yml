name: Release Kof
run-name: Release Kof ${{ inputs.version || 'next version' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Independent Kof integration version (blank increments latest Kof tag)
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: ./.github/workflows/release-plugin.yml
    with:
      plugin: kof
      version: ${{ inputs.version }}
    secrets: inherit
    permissions:
      contents: write
      packages: write

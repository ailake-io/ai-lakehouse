name: Release Python
run-name: Release Python SDK ${{ inputs.version || 'next version' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Independent Python SDK version (blank increments the latest python-v tag)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Independent Python SDK version (blank increments the latest python-v tag)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: plugin-release-python
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  resolve:
    name: Resolve Python release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve Python version
        id: meta
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Python releases must run from main (received $GITHUB_REF)" >&2
            exit 1
          fi
          git fetch --tags --force
          BASE=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' ailake-py/Cargo.toml | head -1)
          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
          else
            LATEST=$(git tag --list 'python-v*' --sort=-version:refname | head -1)
            if [ -n "$LATEST" ]; then BASE=${LATEST#python-v}; fi
            [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid base version: $BASE" >&2; exit 1; }
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be MAJOR.MINOR.PATCH" >&2; exit 1; }
          TAG="python-v$VERSION"
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            SOURCE_SHA=$(git rev-parse "$TAG^{commit}")
          else
            SOURCE_SHA="$GITHUB_SHA"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  linux:
    name: Build and test Linux (${{ matrix.target }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
      max-parallel: 1
    steps:
      - name: Fix Docker-owned files from Maturin builds
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine sh -c \
            "rm -rf dist/ target/ 2>/dev/null; chown -R $(id -u):$(id -g) . 2>/dev/null; true" || true
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set Python SDK version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: python3 scripts/plugins.py update --plugin python --version "$VERSION"
      - uses: PyO3/maturin-action@v1
        env:
          CARGO_TARGET_DIR: /tmp/ailake-target-${{ matrix.target }}
          RUNNER_ALLOW_RUNASROOT: "1"
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          before-script-linux: |
            yum install -y perl-core make gcc 2>/dev/null \
              || dnf install -y perl-core make gcc 2>/dev/null \
              || apt-get install -y perl make gcc 2>/dev/null \
              || true
          command: build
          args: --release --out dist --manifest-path ailake-py/Cargo.toml
      - name: Test the Linux x86_64 wheel
        if: matrix.target == 'x86_64'
        run: |
          python3 -m pip install pytest mypy pandas pyarrow polars duckdb
          python3 -m pip install --force-reinstall --no-deps dist/*.whl
          python3 -m mypy ailake-py/python/ailake/ \
            --ignore-missing-imports --follow-imports=silent --no-strict-optional
          python3 tests/compat/check_ailake_py.py
          python3 -m pytest ailake-py/tests/ -v
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: Build macOS wheel (${{ matrix.target }})
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
      max-parallel: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13
      - name: Set Python SDK version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: python3 scripts/plugins.py update --plugin python --version "$VERSION"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release --out dist --find-interpreter --manifest-path ailake-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Build Windows wheel (x86_64)
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Set Python SDK version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: python scripts/plugins.py update --plugin python --version "$env:VERSION"
      - name: Install Rust (Windows)
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $tmp = "$env:TEMP\rustup-init.exe"
            Invoke-WebRequest -Uri 'https://win.rustup.rs/x86_64' -OutFile $tmp
            Start-Process -FilePath $tmp -ArgumentList '-y','--default-toolchain','stable','--target','x86_64-pc-windows-msvc' -Wait -NoNewWindow
            Remove-Item $tmp
          } else {
            rustup toolchain install stable --target x86_64-pc-windows-msvc
            rustup default stable
          }
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Add Strawberry Perl to PATH
        shell: pwsh
        run: echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: PyO3/maturin-action@v1
        env:
          CARGO_TARGET_DIR: C:\t
        with:
          target: x86_64
          command: build
          args: --release --out dist --manifest-path ailake-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist/*
          if-no-files-found: error

  sdist:
    name: Build Python source distribution
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fix Docker-owned files from Maturin builds
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine sh -c \
            "rm -rf dist/ 2>/dev/null; chown -R $(id -u):$(id -g) . 2>/dev/null; true" || true
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Set Python SDK version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: python3 scripts/plugins.py update --plugin python --version "$VERSION"
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path ailake-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Python SDK
    needs: [resolve, linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create versioned source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_VERSION=$(git show "$TAG:ailake-py/Cargo.toml" | sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' | head -1)
            [ "$TAG_VERSION" = "$VERSION" ] || { echo "Existing $TAG has Python version $TAG_VERSION" >&2; exit 1; }
            TAG_SHA=$(git rev-parse "$TAG^{commit}")
            [ "$TAG_SHA" = "$SOURCE_SHA" ] || { echo "Existing $TAG points at another source commit" >&2; exit 1; }
          else
            python3 scripts/plugins.py update --plugin python --version "$VERSION"
            sed -i -E "s/ailake==[0-9]+\.[0-9]+\.[0-9]+/ailake==$VERSION/g" docs/specs/CLOUD_DEPLOY.md
            git add ailake-py/Cargo.toml docs/specs/CLOUD_DEPLOY.md
            git commit -m "chore(python): release $VERSION [skip ci]"
            git tag "$TAG" -m "Release Python SDK $VERSION"
            git push origin "$TAG"
          fi
      - name: Publish wheels to PyPI
        run: |
          python -m pip install twine
          python -m twine upload --skip-existing dist/*
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CORE_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' ailake-core/Cargo.toml | head -1)
          NOTES="Python SDK $VERSION, built with AI-Lake core $CORE_VERSION. Install with: pip install ailake==$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Python SDK $VERSION" --notes "$NOTES"
          fi

name: CI GPU (ailake-index — CUDA/ROCm)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  discover-gpu-runners:
    name: Discover online Windows GPU runners
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_gpu: ${{ steps.discover.outputs.has_gpu }}
    steps:
      - name: Find online Windows GPU runners
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if ! runners_json="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runners?per_page=100" 2>&1)"; then
            echo "::warning::Unable to list self-hosted runners; skipping GPU jobs."
            runners_json='[]'
          fi

          matrix="$(jq -c '
            [.[].runners[]
              | select(.status == "online" and .busy == false)
              | ([.labels[].name | ascii_downcase]) as $labels
              | if (($labels | index("windows")) and ($labels | index("x64"))
                    and ($labels | index("gpu-nvidia"))) then
                  {backend: "cuda", runner: ["self-hosted", "Windows", "X64", "gpu-nvidia"]}
                elif (($labels | index("windows")) and ($labels | index("x64"))
                      and ($labels | index("gpu-amd"))) then
                  {backend: "rocm", runner: ["self-hosted", "Windows", "X64", "gpu-amd"]}
                else empty
                end
            ] | unique_by(.backend)
          ' <<<"${runners_json}")"

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          if [[ "${matrix}" == "[]" ]]; then
            echo "has_gpu=false" >> "${GITHUB_OUTPUT}"
            echo "No online Windows GPU runners found; GPU jobs will be skipped."
          else
            echo "has_gpu=true" >> "${GITHUB_OUTPUT}"
            echo "Online Windows GPU runners found: ${matrix}"
          fi

  # ── Windows self-hosted (bare-metal CUDA or ROCm) ──────────────────────────
  #
  # Runs all ailake-index tests: unit tests (src/gpu.rs, src/hardware.rs, …)
  # and data integration tests (tests/gpu_data.rs — real SGEMM recall checks).
  # ci-gpu-data.yml was merged here; this is the single GPU CI entry point.
  #
  # Runner requirements:
  #   NVIDIA: CUDA Toolkit 11 or 12 (cudart64_*.dll + cublas64_*.dll in PATH)
  #   AMD:    ROCm for Windows (amdhip64.dll + hipblas.dll in PATH)
  #   Rust stable toolchain (rustup), plus the matching `gpu-nvidia` or `gpu-amd` runner label
  index-gpu-windows:
    name: index — gpu (Windows, ${{ matrix.backend }})
    needs: discover-gpu-runners
    if: needs.discover-gpu-runners.outputs.has_gpu == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-gpu-runners.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Locate Rust
        uses: ./.github/actions/locate-rust-windows

      - uses: Swatinem/rust-cache@v2

      - name: Detect GPU backend
        shell: pwsh
        run: |
          function Find-Dll([string]$name) {
            ($env:PATH -split ';') | ForEach-Object {
              $p = Join-Path $_ $name
              if (Test-Path $p) { $p }
            } | Select-Object -First 1
          }
          $cuda = Find-Dll "cudart64_12.dll"
          if (-not $cuda) { $cuda = Find-Dll "cudart64_11.dll" }
          $rocm = Find-Dll "amdhip64.dll"
          if ($cuda) {
            Write-Host "NVIDIA CUDA runtime found: $cuda"
            echo "AILAKE_GPU_BACKEND=cuda" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($rocm) {
            Write-Host "AMD ROCm runtime found: $rocm"
            echo "AILAKE_GPU_BACKEND=rocm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            throw "GPU runner is labeled '${{ matrix.backend }}' but CUDA/ROCm runtime DLLs were not found."
          }

      - name: Verify expected GPU backend
        shell: pwsh
        run: |
          if ($env:AILAKE_GPU_BACKEND -ne "${{ matrix.backend }}") {
            throw "Expected '${{ matrix.backend }}', detected '$env:AILAKE_GPU_BACKEND'."
          }

      - name: Run ailake-index tests (GPU path)
        shell: pwsh
        run: cargo test -p ailake-index -- --nocapture

  # ── Linux self-hosted — NVIDIA (Docker + nvidia-container-toolkit) ─────────
  #
  # Runner label: gpu-nvidia
  # Requirements:
  #   - Linux x86-64, NVIDIA GPU, nvidia-container-toolkit installed
  #   - Verify: docker run --gpus all --rm nvidia/cuda:12.6.0-base-ubuntu22.04 nvidia-smi
  # Disabled: no Linux GPU runner available yet (only Windows self-hosted GPU runner exists).
  # Re-enable by removing `if: false` when a runner with label gpu-nvidia is registered.
  index-gpu-linux-cuda:
    name: index — gpu (Linux/CUDA Docker)
    if: false
    runs-on: [self-hosted, Linux, X64, gpu-nvidia]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build CUDA test image
        run: |
          docker build \
            --file docker/gpu-cuda/Dockerfile \
            --tag ailake-gpu-cuda:ci-${{ github.sha }} \
            .

      - name: Run ailake-index tests in CUDA container
        run: |
          docker run --rm \
            --gpus all \
            -e AILAKE_GPU_BACKEND=cuda \
            -e RUST_BACKTRACE=1 \
            ailake-gpu-cuda:ci-${{ github.sha }} \
            cargo test -p ailake-index -- --nocapture

      - name: Remove CI image
        if: always()
        run: docker rmi ailake-gpu-cuda:ci-${{ github.sha }} || true

  # ── Linux self-hosted — AMD (Docker + ROCm device passthrough) ────────────
  #
  # Runner label: gpu-amd
  # Requirements:
  #   - Linux x86-64, AMD GPU, amdgpu kernel module, /dev/kfd + /dev/dri accessible
  #   - Verify: docker run --device /dev/kfd --device /dev/dri \
  #               --group-add video --rm rocm/dev-ubuntu-22.04:6.2 rocm-smi
  # Disabled: no Linux GPU runner available yet (only Windows self-hosted GPU runner exists).
  # Re-enable by removing `if: false` when a runner with label gpu-amd is registered.
  index-gpu-linux-rocm:
    name: index — gpu (Linux/ROCm Docker)
    if: false
    runs-on: [self-hosted, Linux, X64, gpu-amd]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build ROCm test image
        run: |
          docker build \
            --file docker/gpu-rocm/Dockerfile \
            --tag ailake-gpu-rocm:ci-${{ github.sha }} \
            .

      - name: Run ailake-index tests in ROCm container
        run: |
          docker run --rm \
            --device /dev/kfd --device /dev/dri \
            --group-add video \
            -e AILAKE_GPU_BACKEND=rocm \
            -e RUST_BACKTRACE=1 \
            ailake-gpu-rocm:ci-${{ github.sha }} \
            cargo test -p ailake-index -- --nocapture

      - name: Remove CI image
        if: always()
        run: docker rmi ailake-gpu-rocm:ci-${{ github.sha }} || true

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_override:
        description: "Version to release (e.g. 0.1.0). Leave empty for automatic patch+1."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  wait-for-ci:
    name: Wait for CI checks to pass
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: read
      actions: read
    steps:
      - name: Poll check-runs for this commit until everything else is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          # Excludes this workflow's own job names — Release always reports pending/
          # in-progress for itself, which would deadlock the wait otherwise.
          SELF_JOBS='^(Wait for CI checks to pass|Create GitHub Release|Sync version bump to develop|Publish to crates\.io|Build and upload JNI library)$'

          echo "Waiting for all other check-runs on $SHA to complete successfully..."
          for i in $(seq 1 90); do
            runs_json=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate -q '.check_runs')
            others=$(echo "$runs_json" | jq --arg self "$SELF_JOBS" '[.[] | select(.name | test($self) | not)]')
            total=$(echo "$others" | jq 'length')
            pending=$(echo "$others" | jq '[.[] | select(.status != "completed")] | length')
            failed=$(echo "$others" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required")]')
            failed_count=$(echo "$failed" | jq 'length')

            if [ "$failed_count" -gt 0 ]; then
              echo "::error::One or more required checks failed for $SHA:"
              echo "$failed" | jq -r '.[] | "  - \(.name): \(.conclusion)"'
              exit 1
            fi

            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "All $total required check(s) completed successfully."
              exit 0
            fi

            echo "  [$((i * 20))s] $pending/$total check(s) still pending (or none reported yet)..."
            sleep 20
          done
          echo "::error::Timed out after 30 minutes waiting for CI checks to complete on $SHA."
          exit 1

  release:
    name: Create GitHub Release
    needs: wait-for-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # needed to create tags and GitHub Releases
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history needed to read latest tag
          # main is protected by a ruleset requiring PRs; the default GITHUB_TOKEN
          # pushes as github-actions[bot], which isn't in the ruleset's bypass list.
          # ACTIONS_PAT belongs to a bypass-listed user, so the version-bump commit
          # and release tag can be pushed directly.
          token: ${{ secrets.ACTIONS_PAT }}

      - name: Bump patch version from latest tag
        id: version
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Derive next version from latest semver tag (patch+1),
          # or use version_override when explicitly provided.
          LATEST=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
          LATEST=${LATEST:-v0.0.0}
          MAJOR=$(echo "${LATEST#v}" | cut -d. -f1)
          MINOR=$(echo "${LATEST#v}" | cut -d. -f2)
          PATCH=$(echo "${LATEST#v}" | cut -d. -f3)
          if [ -n "${{ inputs.version_override }}" ]; then
            NEW_VERSION="${{ inputs.version_override }}"
          else
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          NEW_TAG="v$NEW_VERSION"

          # Bump core Cargo manifests and internal dependency pins while
          # preserving package versions registered as independently released.
          OLD_VERSION="${LATEST#v}"
          python3 scripts/plugins.py bump-core-cargo \
            --from-version "$OLD_VERSION" --version "$NEW_VERSION"

          # Fix internal workspace dep versions regardless of stale value.
          # The sed above only replaces the exact OLD_VERSION; if a workspace dep
          # was added/merged with an outdated version it would be missed.
          for INTERNAL in ailake-core ailake-vec ailake-store ailake-fts ailake-parquet \
                          ailake-index ailake-catalog ailake-file ailake-query ailake-jni \
                          ailake-cli ailake-py; do
            sed -i -E "s/(${INTERNAL}[[:space:]]*=[[:space:]]*\{[^}]*version[[:space:]]*=[[:space:]]*\")[^\"]*/\1${NEW_VERSION}/" Cargo.toml
          done

          # Plugin artifacts and the Python SDK have their own release cadence.
          # Their version targets live in scripts/plugins.json, so new entries
          # don't require changes to this release workflow.
          python3 scripts/plugins.py update --policy core --version "$NEW_VERSION"

          # Promote the accumulated release notes before tagging. Keep a fresh
          # [Unreleased] section at the top so the next development cycle has
          # an explicit place for user-visible changes.
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          if grep -q "^## \[$NEW_VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md already contains [$NEW_VERSION], skipping promotion"
          else
            CHANGELOG_TMP=$(mktemp)
            awk -v version="$NEW_VERSION" -v date="$RELEASE_DATE" '
              /^## \[Unreleased\]$/ {
                print
                print ""
                print "## [" version "] — " date
                next
              }
              { print }
            ' CHANGELOG.md > "$CHANGELOG_TMP"
            mv "$CHANGELOG_TMP" CHANGELOG.md
          fi

          # Doc-example version placeholders for the core release tag and
          # crates.io dependencies. Python package versions have their own
          # release workflow. CHANGELOG.md is historical and must not be rewritten.
          DOC_FILES=$(grep -rl \
            -e "ailake-core[[:space:]]*=[[:space:]]*\"$OLD_VERSION\"" \
            -e "ailake-query[[:space:]]*=[[:space:]]*\"$OLD_VERSION\"" \
            -e "ailake-store[[:space:]]*=[[:space:]]*\"$OLD_VERSION\"" \
            --include="*.md" . 2>/dev/null | grep -v "CHANGELOG.md" || true)
          for f in $DOC_FILES; do
            sed -i -E \
              -e "s/(ailake-core[[:space:]]*=[[:space:]]*\")$OLD_VERSION(\")/\1$NEW_VERSION\2/g" \
              -e "s/(ailake-query[[:space:]]*=[[:space:]]*\")$OLD_VERSION(\")/\1$NEW_VERSION\2/g" \
              -e "s/(ailake-store[[:space:]]*=[[:space:]]*\")$OLD_VERSION(\")/\1$NEW_VERSION\2/g" \
              "$f"
          done

          # ailake-fts workspace-dependency example — mirrors root Cargo.toml.
          if [ -f docs/architecture/WORKSPACE.md ]; then
            sed -i -E "s/(ailake-fts[[:space:]]*=[[:space:]]*\{ path = \"ailake-fts\", version = \")$OLD_VERSION(\" \})/\1$NEW_VERSION\2/" \
              docs/architecture/WORKSPACE.md
          fi

          # The release job starts from a clean checkout, so stage all tracked
          # version, changelog, and documentation changes together.
          git add -u
          git diff --cached --quiet || \
            git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git pull --rebase origin main
          git push origin main

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG"         >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists, skipping"
          else
            gh release create "$TAG" \
              --title "AI-Lake $TAG" \
              --notes "## $TAG

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full release notes.

          ### Rust crates (crates.io)
          All crates bumped to \`${{ steps.version.outputs.version }}\`.

          ### Python SDK
          Published separately through the \`Release Python\` workflow.

          ### JNI library
          Linux \`libailake_jni.so\` attached as a release asset. Plugin integrations,
          the Python SDK, and Kof publish through their own versioned workflows.
          " \
              --draft=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  sync-develop:
    name: Sync version bump to develop
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Same bypass-listed identity as the main-branch bump commit — develop
          # is also protected by a PR-required ruleset.
          token: ${{ secrets.ACTIONS_PAT }}

      - name: Cherry-pick version-bump commit onto develop
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="${{ needs.release.outputs.tag }}"
          # The tag is created immediately after the bump commit (before any
          # other commits land on main), so it always points at that exact commit.
          BUMP_SHA=$(git rev-list -n 1 "$TAG")

          git fetch origin develop
          git checkout -B develop origin/develop

          if git cherry-pick "$BUMP_SHA"; then
            git push origin develop
          else
            git cherry-pick --abort
            echo "::error::Version-bump commit $BUMP_SHA (tag $TAG) did not cherry-pick cleanly onto develop — develop is now version-drifted from main. Resolve manually: 'git checkout develop && git cherry-pick $BUMP_SHA', fix conflicts, then push."
            exit 1
          fi

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      # Publish in dependency order (leaf crates first).
      # crates.io needs ~30 s after each publish before dependents can resolve it.
      # Exit code 10 = crate version already exists on crates.io — safe to skip.
      - name: Publish all crates
        run: |
          pub() {
            cargo publish -p "$1" || { c=$?; [ $c -eq 10 ] && echo "$1 already published, skipping" || exit $c; }
          }
          pub ailake-core
          sleep 30
          pub ailake-secrets
          sleep 30
          pub ailake-vec
          pub ailake-store
          pub ailake-cache
          pub ailake-fts
          sleep 30
          pub ailake-parquet
          pub ailake-index
          pub ailake-catalog
          sleep 30
          pub ailake-file
          sleep 30
          pub ailake-query
          sleep 30
          pub ailake-jni
          pub ailake-cli

  publish-jni:
    name: Build and upload JNI library
    needs: [release, publish-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build libailake_jni.so
        run: cargo build --release -p ailake-jni

      - name: Upload JNI library to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" target/release/libailake_jni.so --clobber

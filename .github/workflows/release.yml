name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

concurrency:
  group: core-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate tag, main ancestry and prepared versions
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          python3 scripts/release_tag.py "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  wait-for-ci:
    name: Wait for CI checks to pass
    needs: validate-tag
    runs-on: ubuntu-latest
    # Job limit stays above the 90-minute poll loop below, so a slow CI ends
    # in the loop's clear timeout error instead of the job being cancelled
    # (v0.1.20's first run was cancelled the moment CI turned green at 30 min).
    timeout-minutes: 100
    permissions:
      checks: read
      actions: read
    steps:
      - name: Poll check-runs for this commit until everything else is green
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.validate-tag.outputs.sha }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          # Exclude this workflow's whole check suite, including reusable
          # Python jobs waiting for publication. Otherwise CI waits on itself.
          SELF_SUITE=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq '.check_suite_id')
          [[ "$SELF_SUITE" =~ ^[0-9]+$ ]]

          echo "Waiting for all other check-runs on $SHA to complete successfully..."
          for i in $(seq 1 270); do
            runs_json=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate --slurp | jq '[.[].check_runs[]]')
            others=$(echo "$runs_json" | jq --argjson self "$SELF_SUITE" '[.[] | select(.check_suite.id != $self)]')
            total=$(echo "$others" | jq 'length')
            pending=$(echo "$others" | jq '[.[] | select(.status != "completed")] | length')
            failed=$(echo "$others" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required")]')
            failed_count=$(echo "$failed" | jq 'length')

            if [ "$failed_count" -gt 0 ]; then
              echo "::error::One or more required checks failed for $SHA:"
              echo "$failed" | jq -r '.[] | "  - \(.name): \(.conclusion)"'
              exit 1
            fi

            # A tag push does not start branch CI. Require a successful CI
            # push run on this exact commit, not just a CodeQL check.
            ci_runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=100")
            ci_ok=$(echo "$ci_runs" | jq '[.workflow_runs[] | select(.head_branch == "main" and .conclusion == "success")] | length')
            if [ "$ci_ok" -gt 0 ] && [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "All $total required check(s) completed successfully."
              exit 0
            fi

            echo "  [$((i * 20))s] $pending/$total check(s) still pending (or none reported yet)..."
            sleep 20
          done
          echo "::error::Timed out after 90 minutes waiting for CI checks to complete on $SHA."
          exit 1

  release:
    name: Create GitHub Release
    needs: [validate-tag, wait-for-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # needed to create the GitHub Release
    outputs:
      version: ${{ needs.validate-tag.outputs.version }}
      tag: ${{ needs.validate-tag.outputs.tag }}
      sha: ${{ needs.validate-tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
          persist-credentials: false

      - name: Create GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists, skipping"
          else
            gh release create "$TAG" --verify-tag \
              --title "AI-Lake $TAG" \
              --notes "## $TAG

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md) for full release notes.

          ### Rust crates (crates.io)
          Core crates prepared at \`${{ needs.validate-tag.outputs.version }}\`.

          ### Python SDK
          Published automatically at the same version through the \`Release Python\` workflow after crates and JNI.

          ### JNI library
          Linux \`libailake_jni.so\` attached as a release asset. Plugin integrations,
          the Python SDK, and Kof publish through their own versioned workflows.
          " \
              --draft=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-tag.outputs.tag }}

  sync-develop:
    name: Sync released tag to develop
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The existing sync identity can update protected develop.
          token: ${{ secrets.ACTIONS_PAT }}

      - name: Merge released main into develop
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG="${{ needs.release.outputs.tag }}"
          git fetch origin develop
          git checkout -B develop origin/develop

          # Merge the released commit (not a cherry-pick of the bump alone):
          # changes merged straight into main (hotfix PRs) also reach develop,
          # and main becomes an ancestor of develop. On conflict main wins —
          # it is what was just released. Idempotent on reruns.
          if ! git merge --no-ff -X theirs "$TAG" -m "chore: sync main ($TAG) into develop"; then
            # -X theirs does not cover modify/delete conflicts; take main's side.
            for f in $(git diff --name-only --diff-filter=U); do
              if git cat-file -e "$TAG:$f" 2>/dev/null; then
                git checkout "$TAG" -- "$f"
              else
                git rm -q -- "$f"
              fi
            done
            git commit --no-edit
          fi

          # Develop may hold unreleased work merged after the release PR;
          # anything else differing from the tag means the sync went wrong.
          git diff --stat "$TAG" develop
          git push origin develop

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      # Publish in dependency order (leaf crates first).
      # crates.io needs ~30 s after each publish before dependents can resolve it.
      # Exit code 10 = crate version already exists on crates.io — safe to skip.
      - name: Publish all crates
        run: |
          pub() {
            cargo publish -p "$1" || { c=$?; [ $c -eq 10 ] && echo "$1 already published, skipping" || exit $c; }
          }
          pub ailake-core
          sleep 30
          pub ailake-secrets
          sleep 30
          pub ailake-vec
          pub ailake-store
          pub ailake-cache
          pub ailake-fts
          sleep 30
          pub ailake-parquet
          pub ailake-index
          pub ailake-catalog
          sleep 30
          pub ailake-file
          sleep 30
          pub ailake-query
          sleep 30
          pub ailake-jni
          pub ailake-cli

  publish-jni:
    name: Build and upload JNI library
    needs: [release, publish-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.4'

      - name: Build libailake_jni.so
        run: cargo build --release --locked -p ailake-jni

      - name: Upload JNI library to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" target/release/libailake_jni.so --clobber

  publish-python:
    name: Publish matching Python SDK
    needs: [release, publish-crates, publish-jni]
    uses: ./.github/workflows/release-python.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
    permissions:
      actions: read
      contents: write

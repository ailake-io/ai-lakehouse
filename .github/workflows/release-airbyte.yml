name: Release Airbyte
run-name: Release Airbyte ${{ inputs.version || 'next version' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Independent Airbyte version (blank increments the latest tag)
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: ./.github/workflows/release-plugin.yml
    with:
      plugin: airbyte
      version: ${{ inputs.version }}
    secrets: inherit
    permissions:
      contents: write
      packages: write

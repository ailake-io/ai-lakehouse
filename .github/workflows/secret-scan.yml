name: Secret Scan

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Pre-checkout cleanup of root-owned files
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine sh -c \
            "rm -rf dist dist-raw 2>/dev/null; chown -R $(id -u):$(id -g) . 2>/dev/null; true" || true

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          # Lob detector excluded: its 35-char key regex has no word-boundary
          # on the trailing side, so it matches long snake_case identifiers
          # starting with `test_`/`live_` (e.g. test function names) as a
          # false positive. Lob's test-mode verification endpoint accepts any
          # correctly-shaped string, so these come back "verified". Project
          # has no legitimate Lob (mail/print API) usage.
          extra_args: --only-verified --exclude-detectors=Lob

name: Republish Python SDK
run-name: Republish Python SDK ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing Python SDK version to rebuild and publish (for example 0.1.16)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release-python.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
    permissions:
      actions: read
      contents: write

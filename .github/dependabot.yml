version: 2
updates:
  # One weekly PR that refreshes both Rust lockfiles (the workspace and the
  # separate fuzz/ workspace). lockfile-only never edits Cargo.toml, so
  # semver-major upgrades stay a manual decision.
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/fuzz"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: lockfile-only
    groups:
      cargo:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

[package]
name        = "ailake-catalog"
version = "0.1.23"
edition     = "2021"
description = "Iceberg Spec v2 catalog backends (Hadoop, REST, Glue, Nessie, JDBC) for AI-Lake"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/ThiagoLange/ai-lakehouse"
keywords    = ["iceberg", "catalog", "lakehouse", "parquet", "metadata"]
categories  = ["database", "data-structures"]

[features]
rest-catalog     = ["dep:reqwest"]           # REST + Nessie HTTP catalog backends
catalog-glue     = ["dep:aws-sdk-glue", "dep:aws-config"]
catalog-nessie   = ["rest-catalog"]
catalog-jdbc     = ["dep:sqlx-core", "dep:sqlx-postgres", "dep:sqlx-mysql", "dep:rusqlite", "dep:percent-encoding"]
catalog-ducklake = ["dep:duckdb"]

[dependencies]
ailake-core  = { path = "../ailake-core", version = "0.1.23" }
ailake-store = { path = "../ailake-store", version = "0.1.23" }
ailake-secrets = { path = "../ailake-secrets", version = "0.1.23", default-features = false }
serde        = { workspace = true }
serde_json   = { workspace = true }
secrecy      = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
async-trait  = { workspace = true }
thiserror    = { workspace = true }
uuid         = { workspace = true }
bytes        = { workspace = true }
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
base64       = "0.22"
apache-avro  = { workspace = true }
bincode      = { workspace = true }
roaring      = { workspace = true }
parquet      = { workspace = true }
arrow-array  = { workspace = true }
arrow-schema = { workspace = true }

# catalog-glue optional deps
aws-sdk-glue = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-config   = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"], optional = true }

# catalog-jdbc optional deps. Keep the SQLite driver separate from SQLx so its
# bundled SQLite can be updated independently of SQLx's release cadence.
sqlx-core = { version = "0.8", default-features = false, features = ["any", "_rt-tokio", "_tls-rustls-ring-webpki"], optional = true }
sqlx-postgres = { version = "0.8", default-features = false, features = ["any"], optional = true }
sqlx-mysql = { version = "0.8", default-features = false, features = ["any"], optional = true }
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
percent-encoding = { version = "2", optional = true }

# catalog-ducklake optional deps
duckdb = { version = "1", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile    = { workspace = true }
tokio       = { workspace = true }
ailake-file = { path = "../ailake-file", version = "0.1.3" }
proptest    = { workspace = true }
